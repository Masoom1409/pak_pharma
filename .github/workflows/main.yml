
name: Build Windows EXE & Setup Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build PakPharmaPOS EXE and Installer (Windows 2022)
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 3. Install dependencies and build tools
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -c "import reportlab.graphics.barcode.code93; import reportlab.graphics.barcode.widgets; print('ReportLab barcode modules available')"

      - name: 4. Run automated acceptance tests
        shell: cmd
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: 5. Build portable PakPharmaPOS with PyInstaller
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name PakPharmaPOS --paths . --add-data "data;data" --add-data "docs;docs" --collect-all reportlab --collect-submodules reportlab.graphics.barcode --hidden-import reportlab.graphics.barcode.code93 --hidden-import sqlite3 --hidden-import PySide6.QtCore --hidden-import PySide6.QtGui --hidden-import PySide6.QtWidgets --hidden-import openpyxl main.py
          if not exist "dist\PakPharmaPOS\PakPharmaPOS.exe" (echo ERROR: Portable EXE not created & exit /b 1)

      - name: 6. Compile Windows setup installer via Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install Inno Setup' }
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc 'installer\PakPharmaPOS_Installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }

      - name: 7. Locate and stage completed setup installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path . -Recurse -File -Filter 'PakPharmaPOS_Setup_v1.0.0.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE not found. Check OutputBaseFilename in the .iss file.' }
          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination 'release\PakPharmaPOS_Setup_v1.0.0.exe' -Force
          if (-not (Test-Path 'release\PakPharmaPOS_Setup_v1.0.0.exe')) { throw 'Installer staging failed' }
          Write-Host "Installer staged successfully: $($installer.FullName)"

      - name: 8. Upload Windows setup installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakPharmaPOS-Windows-Setup-Installer-EXE
          path: release/PakPharmaPOS_Setup_v1.0.0.exe
          if-no-files-found: error
          retention-days: 14

      - name: 9. Upload portable standalone application folder
        uses: actions/upload-artifact@v4
        with:
          name: PakPharmaPOS-Windows-Portable-Folder
          path: dist/PakPharmaPOS/
          if-no-files-found: error
          retention-days: 14
