name: Build Windows EXE & Setup Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build PakPharmaPOS EXE and Setup Installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 3. Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 4. Run Automated Acceptance Test Suite
        shell: cmd
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: 5. Build Standalone PakPharmaPOS.exe via PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name PakPharmaPOS --paths . --add-data "data;data" --add-data "docs;docs" --hidden-import sqlite3 --hidden-import PySide6.QtCore --hidden-import PySide6.QtGui --hidden-import PySide6.QtWidgets --hidden-import reportlab.graphics.barcode.common --hidden-import reportlab.graphics.barcode.code128 --hidden-import reportlab.graphics.barcode.eanbc --hidden-import reportlab.graphics.barcode.usps --hidden-import openpyxl main.py

      - name: 6. Verify Portable EXE Exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/PakPharmaPOS/PakPharmaPOS.exe')) {
            throw 'PyInstaller executable not found at dist/PakPharmaPOS/PakPharmaPOS.exe'
          }

      - name: 7. Compile Windows Installer via Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          & $iscc 'installer\PakPharmaPOS_Installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }

          # Locate the output generated by the .iss configuration, then put it
          # at a fixed path that actions/upload-artifact can safely use.
          $matches = @(Get-ChildItem -Path '.' -Recurse -File -Filter 'PakPharmaPOS_Setup_v1.0.0.exe' |
            Where-Object { $_.FullName -notmatch '[\\/]release[\\/]' })
          if ($matches.Count -ne 1) {
            throw "Expected exactly one installer EXE after compilation; found $($matches.Count). Check OutputDir and OutputBaseFilename in the .iss file."
          }
          New-Item -ItemType Directory -Path 'release' -Force | Out-Null
          Copy-Item -LiteralPath $matches[0].FullName -Destination 'release/PakPharmaPOS_Setup_v1.0.0.exe' -Force
          if (-not (Test-Path 'release/PakPharmaPOS_Setup_v1.0.0.exe')) {
            throw 'Installer missing after staging'
          }

      - name: 8. Upload Windows Setup Installer EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakPharmaPOS-Windows-Setup-Installer-EXE
          path: release/PakPharmaPOS_Setup_v1.0.0.exe
          if-no-files-found: error

      - name: 9. Upload Portable Standalone EXE Folder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakPharmaPOS-Windows-Portable-Folder
          path: dist/PakPharmaPOS/
          if-no-files-found: error
