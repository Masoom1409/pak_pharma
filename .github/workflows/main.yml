name: Build Windows EXE & Setup Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Build PakPharmaPOS.exe & Setup Wizard (Windows 2022)
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Locate Project Root
        id: locate
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path . -Filter "main.py" -Recurse | Select-Object -First 1
          if ($found) {
            $rel = Resolve-Path -Path $found.DirectoryName -Relative
            echo "WORKDIR=$rel" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not find main.py in repository!"
            exit 1
          }

      - name: 3. Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 4. Install Dependencies
        working-directory: ${{ steps.locate.outputs.WORKDIR }}
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Run Automated Acceptance Test Suite (20 Criteria)
        working-directory: ${{ steps.locate.outputs.WORKDIR }}
        shell: cmd
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: 6. Build Standalone PakPharmaPOS.exe via PyInstaller
        working-directory: ${{ steps.locate.outputs.WORKDIR }}
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean installer\PakPharmaPOS.spec

      - name: 7. Compile Windows Installer (PakPharmaPOS_Setup_v1.0.0.exe) via Inno Setup 6
        working-directory: ${{ steps.locate.outputs.WORKDIR }}
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\PakPharmaPOS_Installer.iss"

      - name: 8. Upload Windows Setup Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakPharmaPOS-Windows-Setup-Installer-EXE
          path: ${{ steps.locate.outputs.WORKDIR }}/dist_installer/PakPharmaPOS_Setup_v1.0.0.exe
          if-no-files-found: error

      - name: 9. Upload Portable Standalone EXE Folder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakPharmaPOS-Windows-Portable-Folder
          path: ${{ steps.locate.outputs.WORKDIR }}/dist/PakPharmaPOS/
          if-no-files-found: error
